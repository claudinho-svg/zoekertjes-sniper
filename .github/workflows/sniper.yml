# Zet dit bestand in je repo op: .github/workflows/sniper.yml
name: zoekertjes-sniper

on:
  schedule:
    - cron: "*/15 * * * *"  # start elk kwartier een ronde van ~14 minuten
  workflow_dispatch:         # knop "Run workflow" om handmatig te starten

permissions:
  contents: write            # nodig om state.json op te slaan

concurrency:
  group: sniper
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Zoekertjes checken
        run: python3 sniper.py --duur 14
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POSTCODE: ${{ secrets.POSTCODE }}
          LOCATIE: ${{ secrets.LOCATIE }}

      - name: Status opslaan
        run: |
          git config user.name "sniper-bot"
          git config user.email "sniper-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "status bijwerken" && git push)
